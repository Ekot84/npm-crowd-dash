services:
  npm-crowd-dash:
    build: .
    image: npm-crowd-dash:latest
    container_name: npm-crowd-dash
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      CROWDSEC_LAPI_URL: "${CROWDSEC_LAPI_URL}"
      CROWDSEC_BOUNCER_KEY: "${CROWDSEC_BOUNCER_KEY}"
      CROWDSEC_MACHINE_ID: "${CROWDSEC_MACHINE_ID}"
      CROWDSEC_MACHINE_PASSWORD: "${CROWDSEC_MACHINE_PASSWORD}"
      POLL_INTERVAL_SECONDS: "${POLL_INTERVAL_SECONDS:-15}"
      DB_PATH: "${DB_PATH:-/data/dashboard.db}"
      RETENTION_DAYS: "${RETENTION_DAYS:-90}"
      REPEAT_OFFENDER_THRESHOLD: "${REPEAT_OFFENDER_THRESHOLD:-3}"
      COUNTRY_BAN_THRESHOLD: "${COUNTRY_BAN_THRESHOLD:-10}"
      TZ: "Europe/Stockholm"
      # Optional automatic abuse-report emailing — see .env.example.
      AUTO_ABUSE_REPORT: "${AUTO_ABUSE_REPORT:-false}"
      AUTO_ABUSE_THRESHOLD: "${AUTO_ABUSE_THRESHOLD:-8}"
      SMTP_HOST: "${SMTP_HOST:-}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_USER: "${SMTP_USER:-}"
      SMTP_PASSWORD: "${SMTP_PASSWORD:-}"
      SMTP_FROM: "${SMTP_FROM:-}"
      # Required to save an SMTP password via the Settings page in the web
      # UI — see .env.example. Leave unset and the dashboard still runs
      # normally; it just can't store a new SMTP password until this is set.
      SETTINGS_SECRET_KEY: "${SETTINGS_SECRET_KEY:-}"
    volumes:
      - /mnt/user/appdata/npm-crowd-dash/data:/data
