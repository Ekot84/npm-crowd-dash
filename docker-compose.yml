services:
  npm-crowd-dash:
    build: .
    image: npm-crowd-dash:latest
    container_name: npm-crowd-dash
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      CROWDSEC_LAPI_URL: "${CROWDSEC_LAPI_URL}"
      CROWDSEC_BOUNCER_KEY: "${CROWDSEC_BOUNCER_KEY}"
      CROWDSEC_MACHINE_ID: "${CROWDSEC_MACHINE_ID}"
      CROWDSEC_MACHINE_PASSWORD: "${CROWDSEC_MACHINE_PASSWORD}"
      POLL_INTERVAL_SECONDS: "${POLL_INTERVAL_SECONDS:-15}"
      DB_PATH: "${DB_PATH:-/data/dashboard.db}"
      RETENTION_DAYS: "${RETENTION_DAYS:-90}"
      REPEAT_OFFENDER_THRESHOLD: "${REPEAT_OFFENDER_THRESHOLD:-3}"
      COUNTRY_BAN_THRESHOLD: "${COUNTRY_BAN_THRESHOLD:-10}"
      TZ: "Europe/Stockholm"
      REPORT_PUBLIC_IP: "${REPORT_PUBLIC_IP:-}"
      REPORT_MAX_AGE_DAYS: "${REPORT_MAX_AGE_DAYS:-30}"
      # Long ban once an IP reaches N local bans — see README.
      REPEAT_OFFENDER_ESCALATION_ENABLED: "${REPEAT_OFFENDER_ESCALATION_ENABLED:-false}"
      REPEAT_OFFENDER_ESCALATION_THRESHOLD: "${REPEAT_OFFENDER_ESCALATION_THRESHOLD:-8}"
      REPEAT_OFFENDER_ESCALATION_DURATION: "${REPEAT_OFFENDER_ESCALATION_DURATION:-8760h}"
      # AbuseIPDB scores + optional auto-ban — see README. Empty key = off.
      ABUSEIPDB_API_KEY: "${ABUSEIPDB_API_KEY:-}"
      ABUSEIPDB_CACHE_DAYS: "${ABUSEIPDB_CACHE_DAYS:-7}"
      ABUSEIPDB_DAILY_LIMIT: "${ABUSEIPDB_DAILY_LIMIT:-900}"
      ABUSEIPDB_BAN_ENABLED: "${ABUSEIPDB_BAN_ENABLED:-false}"
      ABUSEIPDB_BAN_MIN_SCORE: "${ABUSEIPDB_BAN_MIN_SCORE:-75}"
      ABUSEIPDB_BAN_MIN_BANS: "${ABUSEIPDB_BAN_MIN_BANS:-3}"
      ABUSEIPDB_BAN_DAYS: "${ABUSEIPDB_BAN_DAYS:-30}"
      ABUSEIPDB_BAN_MIN_REPORTERS: "${ABUSEIPDB_BAN_MIN_REPORTERS:-50}"
      ABUSEIPDB_BAN_IGNORE_WHITELIST: "${ABUSEIPDB_BAN_IGNORE_WHITELIST:-false}"
      # Used by the Reports page to send an abuse report you've reviewed
      # there — see .env.example. Nothing is emailed automatically.
      SMTP_HOST: "${SMTP_HOST:-}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_USER: "${SMTP_USER:-}"
      SMTP_PASSWORD: "${SMTP_PASSWORD:-}"
      SMTP_FROM: "${SMTP_FROM:-}"
      # Required to save an SMTP password via the Settings page in the web
      # UI — see .env.example. Leave unset and the dashboard still runs
      # normally; it just can't store a new SMTP password until this is set.
      SETTINGS_SECRET_KEY: "${SETTINGS_SECRET_KEY:-}"
    volumes:
      - /mnt/user/appdata/npm-crowd-dash/data:/data
