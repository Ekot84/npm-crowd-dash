<div id="reports-settings-wrap">
    {% if reports_saved %}
    <p class="save-banner">Saved.</p>
    {% endif %}
    <form class="settings-form"
          hx-post="/settings/reports"
          hx-target="#reports-settings-wrap"
          hx-swap="outerHTML">
        <div class="settings-row">
            <label for="report_max_age_days">Hide IPs not seen for (days)</label>
            <input type="number" id="report_max_age_days" name="report_max_age_days" min="0"
                   value="{{ report_max_age_days }}">
            <p class="filter-hint">Repeat offenders whose latest ban is older than this are left out of the pending list. They're only hidden — if the IP comes back it shows up again. 0 = never hide.</p>
        </div>
        <button type="submit" class="pager-btn">Save</button>
    </form>
</div>
