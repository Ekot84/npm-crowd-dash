<div id="panel-scenarios"
     hx-get="/partials/stats/panel?kind=scenarios&status={{ status }}&offset={{ offset }}"
     hx-trigger="every 30s"
     hx-swap="outerHTML">
    <table class="stats-table">
        <thead><tr><th>Scenario / matched rule</th><th>Count</th></tr></thead>
        <tbody>
            {% for row in rows %}
            <tr><td>{{ row.scenario }}</td><td class="mono">{{ row.count }}</td></tr>
            {% else %}
            <tr><td colspan="2" class="empty">No data.</td></tr>
            {% endfor %}
        </tbody>
    </table>
    {% if has_prev or has_next %}
    <div class="pager">
        <button type="button" class="pager-btn" {{ 'disabled' if not has_prev else '' }}
                hx-get="/partials/stats/panel?kind=scenarios&status={{ status }}&offset={{ [offset - page_size, 0] | max }}"
                hx-target="#panel-scenarios" hx-swap="outerHTML">←</button>
        <button type="button" class="pager-btn" {{ 'disabled' if not has_next else '' }}
                hx-get="/partials/stats/panel?kind=scenarios&status={{ status }}&offset={{ offset + page_size }}"
                hx-target="#panel-scenarios" hx-swap="outerHTML">→</button>
    </div>
    {% endif %}
</div>
